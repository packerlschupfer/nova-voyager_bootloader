; PlatformIO Project Configuration for Nova Voyager Bootloader
; USB DFU Bootloader for GD32F303RCT6 (STM32F103RC compatible)

[common]
platform = ststm32
board = genericSTM32F103RC
board_build.ldscript = $PROJECT_DIR/bootloader.ld

build_flags_base =
    -Os
    -DSTM32F103xE
    -DBOOTLOADER_BUILD
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -nostartfiles
    -I$PROJECT_DIR/include

upload_protocol = stlink
debug_tool = stlink

;===========================================================================
; 72MHz Build (STM32 compatible, USB DFU works)
;===========================================================================
[env:nova_bootloader]
platform = ${common.platform}
board = ${common.board}
board_build.ldscript = ${common.board_build.ldscript}
upload_protocol = ${common.upload_protocol}
debug_tool = ${common.debug_tool}

build_flags =
    ${common.build_flags_base}
    -D USE_120MHZ=0

;===========================================================================
; 120MHz Build (GD32 only, USB DFU disabled - can't get 48MHz)
;===========================================================================
[env:nova_bootloader_120]
platform = ${common.platform}
board = ${common.board}
board_build.ldscript = ${common.board_build.ldscript}
upload_protocol = ${common.upload_protocol}
debug_tool = ${common.debug_tool}

build_flags =
    ${common.build_flags_base}
    -D USE_120MHZ=1

;===========================================================================
; HSE-failure test build (72MHz base, NEVER ship this)
;
; Identical to nova_bootloader except that it never starts the external
; oscillator, so clock_init()'s bounded HSERDY wait polls a genuinely low
; ready bit and genuinely times out. That exercises the detection and the
; HSI fallback on a board whose crystal is fine.
;
; Flash it to test the fault path, then flash nova_bootloader back. It cannot
; reach 48MHz, so it cannot do USB DFU, and it will always take the fallback.
;===========================================================================
[env:nova_bootloader_hsefail]
platform = ${common.platform}
board = ${common.board}
board_build.ldscript = ${common.board_build.ldscript}
upload_protocol = ${common.upload_protocol}
debug_tool = ${common.debug_tool}

build_flags =
    ${common.build_flags_base}
    -D USE_120MHZ=0
    -D HSE_FAIL_TEST=1
